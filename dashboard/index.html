<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to board</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">Token Launch Radar</div>
        <div class="brand-sub" id="topbar-sub"></div>
      </div>
    </div>
    <div class="topbar-meta" id="topbar-meta"></div>
  </div>
</header>
<main id="board" tabindex="-1">
  <section class="lede">
    <div>
      <h1 id="lede-title"></h1>
      <p id="lede-desc" class="lede-desc"></p>
    </div>
    <div class="facts" id="facts"></div>
  </section>
  <section class="controls-wrap">
    <div class="controls" id="controls"></div>
  </section>
  <section id="table-section"></section>
  <section class="model-section" id="model-section"></section>
</main>
<dialog class="detail" id="detail" aria-labelledby="detail-title">
  <div class="detail-inner" id="detail-inner"></div>
</dialog>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
